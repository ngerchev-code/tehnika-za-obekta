name: Компилиране на APK
on:
  push:
    branches: [ main ]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: 22 }
      - uses: actions/setup-java@v5
        with: { distribution: temurin, java-version: 21 }
      - name: Android SDK (вграден в GitHub)
        run: echo "ANDROID_HOME=$ANDROID_HOME" && ls "$ANDROID_HOME"
      - run: npm ci
      - run: npx cap sync android
      - name: Gradle build
        working-directory: android
        env:
          VERSION_CODE: ${{ github.run_number }}
        run: |
          chmod +x gradlew
          set +e
          ./gradlew assembleRelease --no-daemon --stacktrace > ../gradle.log 2>&1
          code=$?
          tail -60 ../gradle.log
          if [ $code -ne 0 ]; then
            grep -E "What went wrong|error:|Error|FAILURE|Could not|Caused by" -A3 ../gradle.log | head -40 | while IFS= read -r l; do echo "::error::$l"; done
            exit $code
          fi
      - run: mv android/app/build/outputs/apk/release/app-release.apk "Tehnika-za-obekta-v1.0.${{ github.run_number }}.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: Tehnika-za-obekta-APK
          path: Tehnika-za-obekta-*.apk
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Техника за обекта v1.0.${{ github.run_number }}
          files: Tehnika-za-obekta-*.apk
