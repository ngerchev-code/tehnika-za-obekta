name: Компилиране на APK
on:
  push:
    branches: [ main ]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      - uses: android-actions/setup-android@v3
      - run: npm ci
      - run: npx cap sync android
      - name: Gradle build
        working-directory: android
        env:
          VERSION_CODE: ${{ github.run_number }}
        run: chmod +x gradlew && ./gradlew assembleRelease --no-daemon
      - run: mv android/app/build/outputs/apk/release/app-release.apk "Tehnika-za-obekta-v1.0.${{ github.run_number }}.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: Tehnika-za-obekta-APK
          path: Tehnika-za-obekta-*.apk
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Техника за обекта v1.0.${{ github.run_number }}
          files: Tehnika-za-obekta-*.apk
